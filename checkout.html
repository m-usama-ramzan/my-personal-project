<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Brand's Leftover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shop.css">
</head>
<body class="checkout-page">
  <header class="site-header">
    <a class="button" href="index.html" style="justify-self:start;padding:0.45rem 0.7rem;font-size:0.8rem">Back</a>
    <a class="logo" href="index.html" aria-label="Brand's Leftover">
      <span class="logo-mark">
        <svg class="logo-mark__ring" viewBox="0 0 180 180" aria-hidden="true">
          <path d="M36 86c10-46 98-52 112-10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M28 98c20 48 102 50 124 6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="logo-mark__text">
          <span>Brand's</span>
          <span>Leftover</span>
        </span>
      </span>
    </a>
    <a class="cart-button" href="#" data-open-cart aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 4H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
      <span data-cart-count hidden>0</span>
    </a>
  </header>

  <div class="checkout-wrap">
    <form id="checkout-form">
      <h2>Contact</h2>
      <div class="field"><input name="email" type="email" placeholder="Email" required></div>
      <div class="field"><input name="phone" type="tel" placeholder="Phone" required></div>

      <h2>Delivery</h2>
      <div class="field">
        <select id="city" name="city" required></select>
      </div>
      <div class="field">
        <select name="country" disabled>
          <option selected>Pakistan</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><input name="firstName" placeholder="First name" required></div>
        <div class="field"><input name="lastName" placeholder="Last name" required></div>
      </div>
      <div class="field"><input name="address" placeholder="Address" required></div>
      <div class="field"><input name="apartment" placeholder="Apartment, suite, etc. (optional)"></div>
      <div class="field-row">
        <div class="field"><input name="cityText" placeholder="Area / locality (optional)"></div>
        <div class="field"><input name="postal" placeholder="Postal code (optional)"></div>
      </div>

      <h2>Shipping method</h2>
      <div class="ship-box">
        <span>Standard shipping</span>
        <strong id="shipping-amount">Rs 0</strong>
      </div>

      <h2>Payment</h2>
      <div class="cod-box">
        <span>Cash on delivery</span>
        <strong>COD</strong>
      </div>
      <p class="lede">Pay in cash when the order arrives. No card payment on this site.</p>

      <button class="button" type="submit">Place order</button>
    </form>

    <aside class="checkout-aside">
      <div id="checkout-summary"></div>
    </aside>
  </div>

  <section id="checkout-done" class="checkout-wrap" hidden>
    <div>
      <h1>Order placed</h1>
      <p class="lede">Thank you. Your order <strong id="order-id"></strong> is cash on delivery.</p>
      <div id="order-bill"></div>
      <p><a class="button" href="index.html">Back to shop</a></p>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="products.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/shop.js"></script>
  <script>
    ShopDB.getProducts().then(function (list) {
      window.PRODUCTS = list;
      Shop.refresh();
    });
  </script>
</body>
</html>
